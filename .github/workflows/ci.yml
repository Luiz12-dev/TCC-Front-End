name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # O build com SSR e a checagem mais valiosa aqui: pega erro de
      # template e de tipo que o editor deixou passar.
      - name: Build de producao
        run: npm run build

      - name: Rodar os testes
        run: npm test -- --watch=false
