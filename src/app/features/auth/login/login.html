<div class="auth-card">
  <div class="glow-effect"></div>
  <div class="card-content">
    <div class="auth-header">
      <div class="logo-icon"><i class="ph ph-scissors"></i></div>
      <h2>CORTÊS</h2>
      <p class="text-muted">Bem-vindo de volta, nobre.</p>
    </div>

    <div *ngIf="errorMsg" class="alert-error">
      <i class="ph ph-warning-circle"></i> {{ errorMsg }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>E-MAIL</label>
        <div class="input-with-icon">
          <i class="ph ph-envelope-simple"></i>
          <input type="email" formControlName="email" placeholder="seu@email.com">
        </div>
      </div>
      
      <div class="form-group mt-md">
        <div class="flex justify-between items-center">
          <label>SENHA</label>
          <a href="#" class="forgot-link">Esqueceu a senha?</a>
        </div>
        <div class="input-with-icon">
          <i class="ph ph-lock-key"></i>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-xl btn-large" [disabled]="loginForm.invalid || loading">
        <span *ngIf="!loading">Acessar o Salão</span>
        <span *ngIf="loading" class="flex justify-center items-center gap-sm">
          <i class="ph ph-spinner animate-spin"></i> Entrando...
        </span>
      </button>
    </form>

    <div class="auth-separator">
      <span>ou</span>
    </div>

    <div class="auth-footer text-muted">
      É um novo cliente? <a routerLink="/auth/register">Agendar agora</a>
    </div>
  </div>
</div>
